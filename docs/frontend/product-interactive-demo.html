<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f4">
  <title>AI 思考助手 · 交互 Demo</title>
  <style>
    :root {
      --bg: #e9ebe8;
      --paper: #f7f7f4;
      --white: #ffffff;
      --ink: #20231f;
      --body: #4d534c;
      --muted: #757b73;
      --faint: #a4a9a2;
      --line: #e0e3dd;
      --accent: #315f50;
      --accent-soft: #e7efeb;
      --warm: #8a6733;
      --warm-soft: #f3ede2;
      --shadow: 0 24px 70px rgba(24,29,25,.14);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; color: inherit; }
    button { cursor: pointer; }
    .stage { min-height: 100vh; display: grid; place-items: center; padding: 28px; }
    .phone { width: min(100%, 410px); height: min(860px, calc(100vh - 56px)); min-height: 680px; position: relative; overflow: hidden; background: var(--paper); border: 8px solid #1d1f1c; border-radius: 44px; box-shadow: var(--shadow); }
    .statusbar { height: 42px; padding: 13px 22px 0; display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; background: var(--paper); position: relative; z-index: 10; }
    .status-icons { display: flex; align-items: center; gap: 6px; }
    .signal { display: flex; align-items: flex-end; gap: 2px; height: 10px; }
    .signal i { width: 2px; border-radius: 1px; background: currentColor; }
    .signal i:nth-child(1) { height: 4px; } .signal i:nth-child(2) { height: 6px; } .signal i:nth-child(3) { height: 8px; } .signal i:nth-child(4) { height: 10px; }
    .battery { width: 19px; height: 9px; padding: 1px; border: 1.5px solid currentColor; border-radius: 3px; }
    .battery span { display: block; width: 76%; height: 100%; background: currentColor; }
    .app { position: absolute; inset: 42px 0 0; overflow: hidden; }
    .view { position: absolute; inset: 0; display: flex; flex-direction: column; opacity: 0; transform: translateX(12px); pointer-events: none; background: var(--paper); transition: opacity .18s ease, transform .18s ease; }
    .view.active { opacity: 1; transform: none; pointer-events: auto; }
    .scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: none; }
    .scroll::-webkit-scrollbar { display: none; }
    .page-head { flex: 0 0 auto; padding: 18px 22px 14px; }
    .page-head h1 { margin: 0; font-size: 28px; line-height: 1.15; font-weight: 650; letter-spacing: 0; }
    .page-head p { margin: 7px 0 0; color: var(--muted); font-size: 14px; line-height: 1.45; }
    .bottom-nav { height: 69px; flex: 0 0 69px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 7px 12px 11px; border-top: 1px solid var(--line); background: rgba(247,247,244,.96); backdrop-filter: blur(14px); }
    .nav-button { border: 0; background: transparent; border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--faint); font-size: 11px; }
    .nav-button.active { color: var(--ink); }
    .nav-button svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .capture-view { background: var(--paper); }
    .capture-head { padding: 18px 22px 0; display: flex; justify-content: space-between; align-items: baseline; }
    .capture-head strong { font-size: 18px; font-weight: 600; }
    .capture-head time { color: var(--faint); font-size: 12px; }
    .capture-space { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 20px 22px; }
    .capture-idle, .capture-live { width: 100%; text-align: center; }
    .capture-prompt { margin: 0 0 42px; color: var(--body); font-size: 19px; line-height: 1.55; font-weight: 400; }
    .record-button { width: 92px; height: 92px; display: grid; place-items: center; margin: 0 auto; border: 0; border-radius: 50%; background: var(--ink); color: #fff; box-shadow: 0 12px 30px rgba(31,35,31,.16); transition: transform .16s ease; }
    .record-button:active { transform: scale(.95); }
    .record-button svg { width: 31px; height: 31px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    .record-label { display: block; margin-top: 16px; font-size: 14px; font-weight: 550; }
    .record-hint { display: block; margin-top: 6px; color: var(--faint); font-size: 11px; }
    .capture-live[hidden], .capture-idle[hidden], .capture-result[hidden] { display: none; }
    .live-state { color: var(--accent); font-size: 12px; font-weight: 600; }
    .record-time { margin-top: 12px; font-size: 38px; line-height: 1; font-variant-numeric: tabular-nums; font-weight: 450; }
    .waveform { height: 92px; margin: 30px auto 36px; display: flex; align-items: center; justify-content: center; gap: 4px; }
    .waveform i { width: 3px; height: 18px; border-radius: 2px; background: var(--accent); animation: wave 1.1s ease-in-out infinite; }
    .waveform i:nth-child(2n) { animation-delay: -.2s; }
    .waveform i:nth-child(3n) { animation-delay: -.45s; }
    .waveform i:nth-child(4n) { animation-delay: -.7s; }
    @keyframes wave { 0%,100% { height: 14px; opacity: .45; } 50% { height: 62px; opacity: 1; } }
    .live-actions { display: flex; justify-content: center; align-items: center; gap: 34px; }
    .live-action { width: 68px; border: 0; background: transparent; color: var(--body); font-size: 12px; }
    .live-action span { width: 52px; height: 52px; display: grid; place-items: center; margin: 0 auto 8px; border-radius: 50%; background: var(--white); border: 1px solid var(--line); }
    .live-action.stop span { background: var(--ink); border-color: var(--ink); color: #fff; }
    .live-action svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .live-action.stop svg { fill: currentColor; stroke: none; }
    .marker-count { margin-top: 24px; color: var(--faint); font-size: 11px; }
    .quick-compose { margin: 0 18px 14px; display: grid; grid-template-columns: 1fr 42px; gap: 8px; align-items: center; padding: 7px 7px 7px 15px; background: var(--white); border: 1px solid var(--line); border-radius: 8px; }
    .quick-compose input { min-width: 0; height: 38px; border: 0; outline: 0; background: transparent; font-size: 15px; }
    .quick-compose input::placeholder { color: var(--faint); }
    .send-button { width: 38px; height: 38px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--accent); color: #fff; opacity: .35; transition: opacity .15s ease; }
    .send-button.ready { opacity: 1; }
    .send-button svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .capture-result { position: absolute; left: 14px; right: 14px; bottom: 78px; z-index: 8; padding: 18px; background: var(--white); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 14px 36px rgba(28,34,29,.12); text-align: left; }
    .result-check { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent); }
    .result-check svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2.2; }
    .capture-result h2 { margin: 12px 0 6px; font-size: 17px; font-weight: 620; }
    .capture-result p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .result-actions { margin-top: 15px; display: flex; gap: 8px; }

    .record-list { padding: 0 22px 28px; }
    .day-label { margin: 10px 0 4px; color: var(--muted); font-size: 12px; font-weight: 600; }
    .record-row { padding: 16px 0; border-bottom: 1px solid var(--line); }
    .record-top { display: flex; align-items: center; gap: 7px; margin-bottom: 7px; color: var(--faint); font-size: 11px; }
    .record-kind { color: var(--accent); }
    .record-text { margin: 0; color: var(--ink); font-size: 15px; line-height: 1.58; }
    .record-link { margin-top: 9px; display: inline-flex; padding: 4px 7px; border: 0; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font-size: 11px; }
    .session-row { padding: 17px 0; border-bottom: 1px solid var(--line); }
    .session-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .session-title strong { font-size: 15px; font-weight: 600; }
    .session-title span { color: var(--faint); font-size: 11px; font-variant-numeric: tabular-nums; }
    .session-row p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .session-meta { margin-top: 10px; display: flex; gap: 7px; color: var(--faint); font-size: 11px; }

    .discover-list { padding: 0 20px 30px; }
    .finding-card { width: 100%; display: block; text-align: left; padding: 19px 2px 20px; border: 0; border-bottom: 1px solid var(--line); background: transparent; }
    .finding-card:first-child { border-top: 1px solid var(--line); }
    .finding-signal { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; color: var(--accent); font-size: 11px; font-weight: 600; }
    .finding-signal time { color: var(--faint); font-weight: 400; }
    .finding-card h2 { margin: 0; font-size: 18px; line-height: 1.45; font-weight: 620; }
    .finding-card p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
    .finding-evidence { margin-top: 12px; color: var(--faint); font-size: 11px; }
    .unread-dot { display: inline-block; width: 6px; height: 6px; margin-right: 6px; border-radius: 50%; background: var(--accent); }

    .detail-head { height: 52px; flex: 0 0 52px; display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; padding: 0 10px; border-bottom: 1px solid var(--line); }
    .icon-button { width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 8px; background: transparent; }
    .icon-button svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .detail-head strong { text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; }
    .finding-detail-scroll { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: none; }
    .finding-detail { padding: 22px 21px 110px; }
    .detail-kicker { color: var(--accent); font-size: 11px; font-weight: 600; }
    .detail-claim { margin: 10px 0 12px; font-size: 24px; line-height: 1.42; font-weight: 620; }
    .detail-reason { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.65; }
    .letter-lead { margin: 18px 0 0; color: var(--body); font-size: 15px; line-height: 1.72; }
    .idea-list { margin-top: 4px; }
    .idea-row { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 13px 0; border-bottom: 1px dashed var(--line); }
    .idea-row:last-child { border-bottom: 0; }
    .idea-number { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: 11px; font-weight: 600; }
    .idea-row p { margin: 1px 0 0; color: var(--body); font-size: 14px; line-height: 1.62; }
    .question-box { padding: 16px; background: var(--warm-soft); border-radius: 8px; }
    .question-box small { display: block; margin-bottom: 6px; color: var(--warm); font-size: 10px; font-weight: 600; }
    .question-box p { margin: 0; color: var(--body); font-size: 14px; line-height: 1.62; }
    .detail-section { padding: 22px 0; border-bottom: 1px solid var(--line); }
    .detail-section h2 { margin: 0 0 12px; font-size: 13px; font-weight: 650; }
    .quote { margin: 0; padding: 12px 0; border-bottom: 1px dashed var(--line); }
    .quote:last-child { border-bottom: 0; }
    .quote p { margin: 0; color: var(--body); font-size: 13px; line-height: 1.58; }
    .quote footer { margin-top: 6px; color: var(--faint); font-size: 10px; }
    .judgement { padding: 16px; background: var(--accent-soft); border-radius: 8px; }
    .judgement small { display: block; margin-bottom: 6px; color: var(--accent); font-size: 10px; font-weight: 600; }
    .judgement p { margin: 0; color: var(--body); font-size: 14px; line-height: 1.62; }
    .unknown { margin: 0; color: var(--body); font-size: 15px; line-height: 1.6; }
    .choice-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; margin-top: 17px; }
    .choice-button { min-height: 44px; padding: 6px; border: 1px solid var(--line); border-radius: 7px; background: var(--white); font-size: 12px; }
    .choice-button.primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .choice-button.selected { border-color: var(--accent); color: var(--accent); background: var(--accent-soft); }
    .context-toggle { width: 100%; min-height: 44px; display: flex; align-items: center; justify-content: space-between; border: 0; background: transparent; padding: 0; color: var(--muted); font-size: 12px; }
    .memory-scroll { max-height: 126px; overflow-y: auto; overscroll-behavior: contain; margin: 0 0 22px; padding: 0 5px 0 0; border-bottom: 1px solid var(--line); scrollbar-width: thin; scrollbar-color: #c9cec8 transparent; }
    .context-history { padding: 7px 0 3px 18px; position: relative; }
    .context-history::before { content: ""; position: absolute; left: 4px; top: 18px; bottom: 6px; border-left: 1px solid #bcc3bc; }
    .history-step { position: relative; padding: 0 0 16px; }
    .history-step::before { content: ""; position: absolute; left: -18px; top: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
    .history-step time { display: block; color: var(--faint); font-size: 10px; }
    .history-step p { margin: 3px 0 0; color: var(--body); font-size: 12px; line-height: 1.5; }
    .research-panel { margin-top: 16px; padding: 15px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); }
    .research-panel strong { display: block; margin-bottom: 8px; font-size: 13px; }
    .research-panel p { margin: 0 0 8px; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .research-panel p:last-of-type { margin-bottom: 0; }
    .research-status { margin-top: 12px; color: var(--accent); font-size: 11px; }
    .conversation { margin-top: 16px; }
    .message { max-width: 88%; margin-bottom: 10px; padding: 11px 12px; border-radius: 8px; font-size: 13px; line-height: 1.55; }
    .message.user { margin-left: auto; background: var(--ink); color: #fff; }
    .message.ai { background: #eceeea; color: var(--body); white-space: pre-line; }
    .detail-compose { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: 1fr 40px; gap: 8px; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: rgba(247,247,244,.97); backdrop-filter: blur(14px); }
    .detail-compose input { min-width: 0; height: 42px; padding: 0 13px; border: 1px solid var(--line); border-radius: 8px; outline: 0; background: var(--white); font-size: 14px; }
    .detail-send { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--ink); color: #fff; }
    .detail-send svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
    .detail-entry { position: absolute; left: 0; right: 0; bottom: 0; z-index: 5; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: rgba(247,247,244,.97); backdrop-filter: blur(14px); }
    .detail-entry button { width: 100%; height: 44px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); color: var(--faint); font-size: 14px; text-align: left; }
    .detail-entry svg { width: 18px; height: 18px; fill: none; stroke: var(--accent); stroke-width: 1.8; }
    .sheet-backdrop { position: absolute; inset: 0; z-index: 30; background: rgba(25,29,25,.24); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
    .sheet-backdrop.open { opacity: 1; pointer-events: auto; }
    .chat-sheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 31; height: 88%; display: flex; flex-direction: column; background: var(--paper); border-radius: 14px 14px 0 0; transform: translateY(102%); transition: transform .24s ease; box-shadow: 0 -18px 50px rgba(25,30,25,.14); }
    .chat-sheet.open { transform: none; }
    .sheet-grabber { width: 34px; height: 4px; margin: 8px auto 3px; border-radius: 2px; background: #cfd3cd; }
    .sheet-head { height: 52px; flex: 0 0 52px; display: grid; grid-template-columns: 42px 1fr 42px; align-items: center; padding: 0 10px; border-bottom: 1px solid var(--line); }
    .sheet-head strong { text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 600; }
    .sheet-close { width: 42px; height: 42px; display: grid; place-items: center; border: 0; background: transparent; border-radius: 8px; }
    .sheet-close svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; }
    .chat-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 24px; scrollbar-width: none; }
    .chat-empty { padding: 38px 22px; color: var(--muted); text-align: center; font-size: 13px; line-height: 1.65; }
    .chat-turn { margin-bottom: 20px; }
    .chat-message { max-width: 88%; margin-bottom: 10px; padding: 11px 13px; border-radius: 8px; font-size: 14px; line-height: 1.6; white-space: pre-line; }
    .chat-message.user { margin-left: auto; background: var(--ink); color: #fff; }
    .chat-message.ai { background: #eceeea; color: var(--body); }
    .candidate-group { margin: 3px 0 0 12px; padding-left: 12px; border-left: 2px solid var(--accent); }
    .candidate-group small { display: block; margin-bottom: 7px; color: var(--accent); font-size: 10px; font-weight: 600; }
    .candidate-item { width: 100%; display: flex; gap: 8px; align-items: flex-start; border: 0; border-bottom: 1px solid var(--line); background: transparent; padding: 9px 0; color: var(--body); text-align: left; font-size: 12px; line-height: 1.5; }
    .candidate-item:last-child { border-bottom: 0; }
    .candidate-state { flex: 0 0 18px; color: var(--accent); font-weight: 600; }
    .candidate-item.queued { color: var(--accent); }
    .candidate-item.merged { color: var(--faint); }
    .typing { color: var(--faint); font-size: 12px; padding: 5px 2px; }
    .chat-compose { flex: 0 0 auto; padding: 9px 12px calc(11px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); background: var(--paper); }
    .chat-input-row { display: grid; grid-template-columns: 42px 1fr 42px; gap: 7px; align-items: center; }
    .chat-icon-button { width: 42px; height: 42px; display: grid; place-items: center; border: 0; border-radius: 50%; background: transparent; color: var(--accent); }
    .chat-icon-button.recording { background: var(--accent-soft); }
    .chat-icon-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .chat-text { width: 100%; height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; outline: 0; background: var(--white); font-size: 14px; }
    .chat-send { width: 40px; height: 40px; display: grid; place-items: center; border: 0; border-radius: 50%; background: var(--ink); color: #fff; opacity: .35; }
    .chat-send.ready { opacity: 1; }
    .asr-state { min-height: 17px; padding: 4px 50px 0; color: var(--accent); font-size: 10px; text-align: center; }
    .secondary-button, .primary-button { min-height: 38px; padding: 0 13px; border-radius: 7px; font-size: 12px; }
    .secondary-button { border: 1px solid var(--line); background: transparent; }
    .primary-button { border: 1px solid var(--accent); background: var(--accent); color: #fff; }
    .toast { position: absolute; left: 50%; bottom: 82px; z-index: 20; transform: translate(-50%,12px); padding: 10px 14px; border-radius: 7px; background: rgba(31,34,30,.92); color: #fff; font-size: 13px; opacity: 0; pointer-events: none; transition: .2s ease; white-space: nowrap; }
    .toast.show { opacity: 1; transform: translate(-50%,0); }

    @media (max-width: 520px) {
      .stage { display: block; min-height: 100dvh; padding: 0; }
      .phone { width: 100%; height: 100dvh; min-height: 620px; border: 0; border-radius: 0; box-shadow: none; }
      .statusbar { height: calc(42px + env(safe-area-inset-top)); padding-top: max(13px, env(safe-area-inset-top)); }
      .app { top: calc(42px + env(safe-area-inset-top)); }
      .bottom-nav { height: calc(69px + env(safe-area-inset-bottom)); flex-basis: calc(69px + env(safe-area-inset-bottom)); padding-bottom: calc(11px + env(safe-area-inset-bottom)); }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main class="stage">
    <section class="phone" aria-label="AI 思考助手移动端 Demo">
      <div class="statusbar"><span id="clock">9:41</span><div class="status-icons"><div class="signal"><i></i><i></i><i></i><i></i></div><span>5G</span><div class="battery"><span></span></div></div></div>
      <div class="app">
        <section class="view capture-view active" id="capture-view">
          <header class="capture-head"><strong>Inbox</strong><time id="today-label"></time></header>
          <div class="capture-space">
            <div class="capture-idle" id="capture-idle">
              <p class="capture-prompt">有什么值得留下？</p>
              <button class="record-button" id="record-button" type="button" aria-label="开始录音"><svg viewBox="0 0 24 24"><rect x="8" y="3" width="8" height="12" rx="4"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
              <strong class="record-label">开始说</strong>
              <span class="record-hint">几句话，或一整场会议</span>
            </div>
            <div class="capture-live" id="capture-live" hidden>

    var state = { view:'capture', activeFinding:null, recording:false, seconds:0, markers:0, contextOpen:false, chatOpen:false, asrRecording:false, aiThinking:false };
    var recordTimer = null;
    function escapeHtml(value) { return String(value).replace(/[&<>'"]/g, function(c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[c]; }); }
    function navMarkup() {
      var items = [{ id:'capture', label:'捕获', icon:icons.capture }, { id:'records', label:'记录', icon:icons.records }, { id:'discover', label:'回声', icon:icons.discover }];
      return items.map(function(item) { return '<button class="nav-button ' + (state.view === item.id ? 'active' : '') + '" type="button" data-view="' + item.id + '">' + item.icon + '<span>' + item.label + '</span></button>'; }).join('');
    }
    function renderNav() { document.querySelectorAll('[data-nav]').forEach(function(nav) { nav.innerHTML = navMarkup(); }); }
    function showView(name) {
      state.view = name;
      document.querySelectorAll('.view').forEach(function(view) { view.classList.toggle('active', view.id === name + '-view'); });
      if (name === 'records') renderRecords();
      if (name === 'discover') renderFindings();
      renderNav();
    }
    function renderRecords() {
      var html = '<div class="day-label">最近</div>';
      records.forEach(function(record) {
        if (record.kind === '录音') {
          html += '<article class="session-row"><div class="session-title"><strong>' + escapeHtml(record.title) + '</strong><span>' + escapeHtml(record.duration) + '</span></div><p>' + escapeHtml(record.text) + '</p><div class="session-meta"><span>完整音频与转写</span><span>·</span><span>' + record.markers + ' 处标记</span></div>' + (record.direction ? '<button class="record-link" type="button" data-open-direction="' + escapeHtml(record.direction) + '">' + escapeHtml(record.direction) + '</button>' : '') + '</article>';
        } else {
          html += '<article class="record-row"><div class="record-top"><span class="record-kind">文字</span><span>' + escapeHtml(record.time) + '</span></div><p class="record-text">' + escapeHtml(record.text) + '</p>' + (record.direction ? '<button class="record-link" type="button" data-open-direction="' + escapeHtml(record.direction) + '">' + escapeHtml(record.direction) + '</button>' : '') + '</article>';
        }
      });
      document.getElementById('record-list').innerHTML = html;
    }
    function renderFindings() {
      document.getElementById('discover-list').innerHTML = findings.map(function(finding) {
        return '<button class="finding-card" type="button" data-finding="' + finding.id + '"><div class="finding-signal"><span>' + (finding.unread ? '<i class="unread-dot"></i>' : '') + escapeHtml(finding.direction) + '</span><time>' + escapeHtml(finding.time) + '</time></div><h2>' + escapeHtml(finding.title) + '</h2><p>' + escapeHtml(finding.preview) + '</p><div class="finding-evidence">我替你多想了 ' + finding.thoughts.length + ' 步</div></button>';
      }).join('');
    }
    function renderFinding() {
      var finding = findings.find(function(item) { return item.id === state.activeFinding; });
      if (!finding) return;
      document.getElementById('direction-title').textContent = finding.direction;
      var memories = state.contextOpen ? '<div class="memory-scroll"><div class="context-history">' + finding.quotes.map(function(quote) { return '<div class="history-step"><time>' + escapeHtml(quote[1]) + '</time><p>' + escapeHtml(quote[0]) + '</p></div>'; }).join('') + '</div></div>' : '';
      var ideas = finding.thoughts.map(function(idea, index) { return '<div class="idea-row"><span class="idea-number">' + (index + 1) + '</span><p>' + escapeHtml(idea) + '</p></div>'; }).join('');
      document.getElementById('finding-detail').innerHTML = '<button class="context-toggle" type="button" data-context><span>相关记忆 · ' + finding.quotes.length + '</span><span>' + (state.contextOpen ? '收起 −' : '展开 ＋') + '</span></button>' + memories + '<div class="detail-kicker">我替你想了想</div><h1 class="detail-claim">' + escapeHtml(finding.title) + '</h1><p class="letter-lead">' + escapeHtml(finding.judgement) + '</p><section class="detail-section"><h2>再往前一步</h2><div class="idea-list">' + ideas + '</div></section><section class="detail-section"><div class="question-box"><small>我现在最想和你确认</small><p>' + escapeHtml(finding.unknown) + '</p></div></section>';
    }
    function openFinding(id) {
      state.activeFinding = id;
      state.contextOpen = true;
      var finding = findings.find(function(item) { return item.id === id; });
      if (finding) finding.unread = false;
      renderFinding();
      showView('finding');
      document.getElementById('finding-scroll').scrollTop = 0;
    }
    function openDirection(direction) {
      var finding = findings.find(function(item) { return item.direction === direction; });
      if (finding) openFinding(finding.id);
      else { showView('discover'); showToast('这个方向还没有新的回声'); }
    }
    function formatTime(seconds) { return String(Math.floor(seconds / 60)).padStart(2,'0') + ':' + String(seconds % 60).padStart(2,'0'); }
    function startRecording() {
      state.recording = true; state.seconds = 0; state.markers = 0;
      document.getElementById('capture-idle').hidden = true;
      document.getElementById('capture-live').hidden = false;
      document.getElementById('quick-form').style.visibility = 'hidden';
      document.getElementById('record-time').textContent = '00:00';
      recordTimer = setInterval(function() { state.seconds += 1; document.getElementById('record-time').textContent = formatTime(state.seconds); }, 1000);
    }
    function stopRecording() {
      clearInterval(recordTimer); state.recording = false;
      var duration = Math.max(state.seconds, 8);
      records.unshift({ id:'session-' + Date.now(), kind:'录音', time:'刚刚', title:'刚刚的语音记录', duration:formatTime(duration), text:'完整转写将在这里保留。AI 会根据内容判断是否值得形成新的回声。', markers:state.markers, direction:'忙碌是不是一种逃避' });
      findings[0].time = '刚刚更新';
      findings[0].unread = true;
      document.getElementById('capture-live').hidden = true;
      document.getElementById('capture-idle').hidden = false;
      document.getElementById('quick-form').style.visibility = '';
      document.getElementById('result-copy').textContent = '我听见你一边说自己很忙，一边又怀疑真正重要的事没有前进。我替你多想了一步。';
      document.getElementById('capture-result').hidden = false;
    }
    function addTextRecord(text) {
      var nowId = Date.now();
      var emotional = /累|难受|焦虑|迷茫|害怕|不敢|没意思|烦/.test(text);
      var technical = /ai|agent|coding|代码|上下文|skill/i.test(text);
      var instant = {
        id: 'instant-' + nowId,
        direction: emotional ? '此刻的心事' : technical ? '正在形成的实践' : '刚刚的想法',
        time: '刚刚', unread: false,
        title: emotional ? '你现在不一定需要马上振作，先承认这件事确实在消耗你。' : technical ? '这条想法真正有潜力的地方，是把一次经验变成可以重复使用的方法。' : '这件事会在此刻冒出来，本身就值得认真听一下。',
        preview: emotional ? '先不用急着解决，我更想帮你把压力来自哪里看清楚。' : '我先不替你归类，而是沿着它继续想了一步。',
        reason: text,
        quotes: [[text, '刚刚']],
        judgement: emotional ? '听起来你不是简单地情绪不好，而是在一件长期没有变化的事情里消耗了太多力气。现在最重要的可能不是逼自己做决定，而是把“我还能承受什么、我真正舍不得什么”分开。' : technical ? '这条记录不必停留在观点。最有价值的方向是把它变成一次可验证的实践：明确输入、执行过程和结果标准，看看它是否真的能在第二个项目中复用。' : '我暂时不想把它解释得太满。它可能在提醒你，有一个需要还没有被正面表达。先保留原话，再补一个具体场景，真正的问题通常会自己显出来。',
        thoughts: emotional ? ['先允许自己不做最终决定，情绪很重的时候，二选一通常会让人更窒息。', '把最近最消耗你的三个具体时刻写下来，看看它们指向工作量、失控感，还是价值感缺失。', '只找一个能在一周内改善 10% 的变化，先让自己重新拥有一点主动权。'] : technical ? ['把这次判断写成一个可以被推翻的假设，而不是方法论口号。', '选择一个真实任务做前后对比，记录返工、人工介入和完成质量。', '如果第二次还能复用，再把它沉淀成模板或 Skill；第一次就抽象通常太早。'] : ['它为什么偏偏在今天出现，可能比它表面的内容更重要。', '找一个最近真实发生的场景，抽象观点会立刻变得清晰。', '暂时不追求结论，下一次想到相关内容时继续放进来。'],
        unknown: emotional ? '如果暂时不用考虑别人期待你怎么做，你最想先停止承受的是什么？' : '你更希望我陪你把它想清楚，还是直接替你做一些具体工作？',
        history: [['刚刚', text]],
        research: { title:'围绕这条想法继续探索', scope:'从一个具体场景开始，而不是泛泛搜索。', output:'得到一个能改变下一步判断的结果。' },
        messages: []
      };
      records.unshift({ id:'text-' + nowId, kind:'文字', time:'刚刚', text:text, direction:instant.direction });
      findings.unshift(instant);
      openFinding(instant.id);
      showToast('我在听，也替你多想了一步');
    }

    function assistantReply(text, finding) {
      if (/调研|查资料|研究|查一下/.test(text)) {
        return '可以。我先把任务收窄为：' + finding.research.title + '。\n\n我会优先寻找一手资料和反例，最后给你直接结论、适用条件，以及它会怎样改变当前判断。你可以继续补充特别想看的范围。';
      }
      if (/总结|阶段性|梳理一下/.test(text)) return '阶段性看，你已经从描述现象走到了一个更具体的判断：' + finding.judgement + '\n\n我会把这次讨论中真正新增的内容单独列出来，由你决定哪些值得等待整理进回声。';
      if (/选择|要不要|怎么选|决策|还是/.test(text)) {
        return '如果现在必须给倾向，我建议先选可逆、能最快获得真实反馈的方案。你缺的不是更多优缺点，而是一个能让下一次选择更容易的证据。把你正在比较的两个选项告诉我，我会直接给出建议和它成立的条件。';
      }
      if (/累|难受|焦虑|迷茫|害怕|不敢|烦/.test(text)) {
        return '我听见了。先不用把这种感受变成一个必须解决的问题。它更像是在告诉你：有些东西已经超出你愿意长期承受的范围。我们可以慢一点，先找出最近哪个具体时刻最让你难受。';
      }
      if (/下一步|怎么办|怎么做|行动/.test(text)) {
        var nextSteps = { work:'下次周会前，只改一件事：让每个人提前写下一个“需要共同判断的问题”，会上先从这些问题开始。', parenting:'今晚先不改变睡觉时间，只给两个有限选择：先刷牙还是先换睡衣。观察拖延是否减少。', home:'今天只处理最容易反复变乱的一平方米，并让所有高频物品一步就能归位。', begin:'给那件拖了很久的事定义一个七天内必须结束的普通版本，今天只写完成标准。', busy:'明天最清醒的四十分钟只推进一个长期方向，期间不处理任何容易完成的小事。', family:'找一个没有发生冲突的时刻，只说一句具体请求，不解释谁对谁错。' };
        return nextSteps[finding.id] || '先找一个十分钟内能开始、完成后能看到变化的动作，不要一次解决整个问题。';
      }
      if (/不对|不是|更关心|我的意思/.test(text)) {
        return '明白，这个修正很重要。我之前收束得太快了。接下来我会把你真正关心的部分放在中心，原来的判断只保留为一段过程，不再当作结论。你可以继续说，哪一部分最接近你的真实意思？';
      }
      return '我明白你的补充了。顺着这句话再往前一步：真正值得确认的不是这个观点听起来是否正确，而是它会改变哪个现实选择。你愿意的话，可以继续给我一个具体场景，我会直接替你分析。';
    }

    function candidateTexts(text, finding) {
      if (/总结|阶段性|梳理一下/.test(text)) return [finding.title, finding.unknown];
      var candidates = {
        work:['周会应围绕待判断的问题组织，而不是按成员逐个汇报。','先试运行两次“会前暴露问题”的会议方式。'],
        parenting:['睡前采用固定边界和两个有限选择，不把是否睡觉作为选项。'],
        home:['家的目标从“永远整齐”调整为“十分钟可以恢复”。'],
        begin:['第一版的完成标准是被看见或使用一次，而不是让自己满意。'],
        busy:['忙碌可能正在替代对真正优先级的选择。','每天最清醒的四十分钟只推进一个长期方向。'],
        family:['理解父母的好意，不等于必须接受让自己有压力的表达方式。']
      };
      return candidates[finding.id] || [];
    }

    function renderChat() {
      var finding = findings.find(function(item) { return item.id === state.activeFinding; });
      if (!finding) return;
      document.getElementById('sheet-title').textContent = finding.direction;
      var html = finding.messages.length ? '' : '<div class="chat-empty">这里是一段独立讨论。你可以补充想法、让我分析或下达任务；对话本身不会进入相关记忆。</div>';
      finding.messages.forEach(function(message) {
        var candidates = '';
        if (message.candidates && message.candidates.length) {
          candidates = '<div class="candidate-group"><small>值得沉淀到回声</small>' + message.candidates.map(function(candidate) {
            var mark = candidate.status === 'queued' ? '✓' : candidate.status === 'merged' ? '✓' : '＋';
            var suffix = candidate.status === 'queued' ? '<br><span style="font-size:10px">等待整理</span>' : candidate.status === 'merged' ? '<br><span style="font-size:10px">已进入回声</span>' : '';
            return '<button class="candidate-item ' + candidate.status + '" type="button" data-candidate="' + candidate.id + '"><span class="candidate-state">' + mark + '</span><span>' + escapeHtml(candidate.text) + suffix + '</span></button>';
          }).join('') + '</div>';
        }
        html += '<div class="chat-turn"><div class="chat-message user">' + escapeHtml(message.user) + '</div>' + (message.pending ? '<div class="typing">正在想…</div>' : '<div class="chat-message ai">' + escapeHtml(message.ai) + '</div>' + candidates) + '</div>';
      });
      document.getElementById('chat-scroll').innerHTML = html;
      setTimeout(function() { document.getElementById('chat-scroll').scrollTop = document.getElementById('chat-scroll').scrollHeight; }, 20);
    }

    function openChat() {
      state.chatOpen = true;
      document.getElementById('sheet-backdrop').classList.add('open');
      document.getElementById('chat-sheet').classList.add('open');
      renderChat();
      setTimeout(function() { document.getElementById('chat-input').focus(); }, 250);
    }
    function closeChat() {
      state.chatOpen = false;
      document.getElementById('sheet-backdrop').classList.remove('open');
      document.getElementById('chat-sheet').classList.remove('open');
    }

    function toggleCandidate(id) {
      var finding = findings.find(function(item) { return item.id === state.activeFinding; });
      finding.messages.forEach(function(message) {
        (message.candidates || []).forEach(function(candidate) {
          if (candidate.id === id && candidate.status !== 'merged') candidate.status = candidate.status === 'queued' ? 'proposed' : 'queued';
        });
      });
      renderChat();
    }
    var toastTimer;
    function showToast(message) {
      var toast = document.getElementById('toast');
      toast.textContent = message; toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { toast.classList.remove('show'); }, 1800);
    }
    document.addEventListener('click', function(event) {
      var nav = event.target.closest('[data-view]');
      if (nav) showView(nav.dataset.view);
      var finding = event.target.closest('[data-finding]');
      if (finding) openFinding(finding.dataset.finding);
      var direction = event.target.closest('[data-open-direction]');
      if (direction) openDirection(direction.dataset.openDirection);
      if (event.target.closest('[data-context]')) { state.contextOpen = !state.contextOpen; renderFinding(); }
      var candidate = event.target.closest('[data-candidate]');
      if (candidate) toggleCandidate(candidate.dataset.candidate);
    });
    document.getElementById('record-button').addEventListener('click', startRecording);
    document.getElementById('mark-button').addEventListener('click', function() {
      state.markers += 1;
      document.getElementById('marker-count').textContent = '已标记 ' + state.markers + ' 处关键时刻';
    });
    document.getElementById('stop-button').addEventListener('click', stopRecording);
    document.getElementById('see-finding').addEventListener('click', function() { document.getElementById('capture-result').hidden = true; openFinding('busy'); });
    document.getElementById('dismiss-result').addEventListener('click', function() { document.getElementById('capture-result').hidden = true; });
    document.getElementById('back-button').addEventListener('click', function() { showView('discover'); });
    document.getElementById('quick-input').addEventListener('input', function(event) { document.getElementById('quick-send').classList.toggle('ready', event.target.value.trim().length > 0); });
    document.getElementById('quick-form').addEventListener('submit', function(event) {
      event.preventDefault(); var input = document.getElementById('quick-input'); var text = input.value.trim();
      if (!text) return; input.value = ''; document.getElementById('quick-send').classList.remove('ready'); addTextRecord(text);
    });
    document.getElementById('open-chat').addEventListener('click', openChat);
    document.getElementById('close-chat').addEventListener('click', closeChat);
    document.getElementById('sheet-backdrop').addEventListener('click', closeChat);
    document.getElementById('chat-input').addEventListener('input', function(event) { document.getElementById('chat-send').classList.toggle('ready', event.target.value.trim().length > 0); });
    document.getElementById('chat-mic').addEventListener('click', function() {
      var mic = document.getElementById('chat-mic');
      var input = document.getElementById('chat-input');
      var status = document.getElementById('asr-state');
      if (!state.asrRecording) {
        state.asrRecording = true;
        mic.classList.add('recording');
        status.textContent = '正在录音，点击麦克风结束';
        input.placeholder = '正在听…';
      } else {
        state.asrRecording = false;
        mic.classList.remove('recording');
        var samples = { work:'我担心取消汇报后，有些人会把问题藏得更深，应该怎么避免？', parenting:'我怕给了选择以后，他会提出更多条件。', home:'我最受不了的是视觉上到处都很乱。', begin:'我其实最怕做出来以后发现自己没有想象中厉害。', busy:'如果只能保留一件事，我最舍不得的是自己的个人项目。', family:'我希望她先问我最近怎么样，而不是一上来就提醒。' };
        input.value = samples[state.activeFinding] || '我想再补充一个具体的情况。';
        input.placeholder = '说说你的想法，或交代一件事';
        status.textContent = '已转成文字，可编辑后发送';
        document.getElementById('chat-send').classList.add('ready');
        input.focus();
      }
    });
    document.getElementById('chat-form').addEventListener('submit', function(event) {
      event.preventDefault(); var input = document.getElementById('chat-input'); var text = input.value.trim();
      if (!text) return;
      var finding = findings.find(function(item) { return item.id === state.activeFinding; });
      var message = { id:'turn-' + Date.now(), user:text, ai:'', candidates:[], pending:true };
      finding.messages.push(message);
      input.value = '';
      document.getElementById('chat-send').classList.remove('ready');
      document.getElementById('asr-state').textContent = '';
      renderChat();
      setTimeout(function() {
        message.ai = assistantReply(text, finding);
        message.pending = false;
        renderChat();
        setTimeout(function() {
          message.candidates = candidateTexts(text, finding).map(function(item, index) { return { id:message.id + '-candidate-' + index, text:item, status:'proposed' }; });
          renderChat();
        }, 650);
      }, 700);
    });
    renderNav(); renderRecords(); renderFindings();
    var now = new Date();
    document.getElementById('clock').textContent = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
    document.getElementById('today-label').textContent = (now.getMonth() + 1) + ' 月 ' + now.getDate() + ' 日';
  </script>
</body>
</html>
